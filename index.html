<!doctype html>
<html lang="id">
<head>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a38">
<title>Ujian V2 (Percobaan)</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#eef4fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.card{width:min(460px,92%);margin:28px auto;padding:22px;background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(7,26,56,.12)}
h1{margin:0 0 4px;font-size:20px}.sub{margin:0 0 16px;font-size:13px;color:#52657d}
label{display:block;margin:12px 0 4px;font-size:13px;font-weight:700}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid #c5d3e4;border-radius:10px;background:#fff}
.btn{display:block;width:100%;min-height:46px;margin-top:14px;border:0;border-radius:10px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2563eb,#0ea5e9);cursor:pointer}
.btn.sec{background:#e2ebf6;color:#172033}.btn.red{background:#dc2626}.btn.green{background:#16a34a}.btn:disabled{opacity:.5}
.err{margin-top:12px;padding:10px;border-radius:10px;background:#fee2e2;color:#991b1b;font-size:13.5px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700}
ol.rules{padding-left:20px;font-size:13.5px;line-height:1.6;color:#334155}

/* ===== UJIAN ===== */
#examScreen{min-height:100dvh}
.xbar{position:fixed;top:0;left:0;right:0;z-index:500;height:44px;padding:0 10px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;display:flex;align-items:center;gap:8px;background:#071a38;color:#fff}
.xname{flex:1;min-width:0;font-size:12px;color:#9db8d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xtimer{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.xtimer.warn{color:#fbbf24}.xtimer.danger{color:#f87171}
.xviol{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:#fde68a}
.xnav{height:32px;padding:0 10px;border:0;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:13px}
.stage{padding:calc(56px + env(safe-area-inset-top,0px)) 12px 90px;max-width:760px;margin:0 auto}
/* PENGUNCIAN TEKS: tidak bisa disorot / tekan-tahan / menu salin */
.lock,.lock *{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
.lock img{-webkit-user-drag:none;pointer-events:none}
.qbox{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(7,26,56,.08)}
.wacana{max-height:38vh;overflow-y:auto;margin-bottom:12px;padding:12px;border-left:4px solid #2563eb;border-radius:8px;background:#f1f6fc;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.qno{font-size:12px;font-weight:700;color:#2563eb;margin-bottom:6px}
.qtext{font-size:17px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.qimg{display:block;max-width:100%;margin:12px auto 0;border-radius:8px}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px;border:2px solid #d5e0ee;border-radius:12px;background:#fff;font-size:16px;line-height:1.45;color:#172033;cursor:pointer}
.opt .L{flex:0 0 28px;height:28px;border-radius:50%;background:#e2ebf6;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.opt .T{flex:1;white-space:pre-wrap;word-break:break-word;padding-top:3px}
.opt.sel{border-color:#2563eb;background:#eff6ff}.opt.sel .L{background:#2563eb;color:#fff}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:400;display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -2px 12px rgba(7,26,56,.12)}
.bottom .btn{margin:0;flex:1}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.gn{padding:10px 0;border:2px solid #d5e0ee;border-radius:10px;background:#fff;font-weight:700;font-size:14px}
.gn.done{background:#dbeafe;border-color:#93c5fd}.gn.cur{border-color:#2563eb;box-shadow:0 0 0 2px #bfdbfe}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;background:rgba(3,16,36,.96);color:#fff}
#penalty{z-index:2000}#confirmBox,#gridBox{z-index:1500}
.mcard{width:min(420px,100%);padding:22px 18px;border-radius:16px;text-align:center;background:#0d3568;border:1px solid rgba(96,165,250,.3)}
.mcard h2{margin:0 0 10px;font-size:20px}.mcard p{margin:0 0 12px;font-size:14px;line-height:1.55;color:#cfe0f5}
.big{font-size:42px;font-weight:800;margin:6px 0}
.note{margin-top:10px;font-size:12px;color:#fbbf24}

.wm{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;background:url(logo.png) center 52%/min(92vw,600px) no-repeat;opacity:.3}
#loginScreen .card{position:relative;z-index:1;background:rgba(255,255,255,.9)}.hero img{display:none}
.qtext,.opt .T,.wacana{font-size:var(--fs,16px)!important}.qimg{cursor:zoom-in}.xbar .xnav{padding:6px 10px}
/* ===== TEMA: biru tua + emas ===== */
body{background:linear-gradient(160deg,#0b2a5b 0,#1d4ed8 38%,#dbeafe 38.1%,#fff7dd 100%) fixed}
#loginScreen .card{padding:0;overflow:hidden;border-radius:18px;box-shadow:0 10px 34px rgba(7,26,56,.28)}
.hero{padding:20px 16px 16px;text-align:center;color:#fff;background:linear-gradient(135deg,#0b2a5b,#1d4ed8);border-bottom:5px solid #f5b301}
.hero img{width:84px;height:84px;object-fit:contain;display:block;margin:0 auto 8px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.school{margin:0;font-size:clamp(12.5px,3.9vw,18px);font-weight:800;letter-spacing:.3px;white-space:nowrap}
.hero .tag{margin:4px 0 0;font-size:12px;color:#fde68a;letter-spacing:1px;font-weight:700}
.fbody{padding:6px 22px 22px}
label{color:#0b2a5b}
select,input{border:2px solid #bfd3ee;background:#f8fbff}select:focus,input:focus{outline:0;border-color:#1d4ed8;background:#fff}
.btn{background:linear-gradient(135deg,#1d4ed8,#0b2a5b);box-shadow:0 3px 8px rgba(29,78,216,.3)}
.btn.gold{background:linear-gradient(135deg,#f5b301,#f59e0b);color:#3b2a00;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 8px rgba(245,158,11,.35)}
.xbar{background:linear-gradient(90deg,#0b2a5b,#1d4ed8)}
.qbox{border-top:4px solid #f5b301}.qno{color:#b45309}
.opt.sel{border-color:#f59e0b;background:#fffbeb}.opt.sel .L{background:#f59e0b;color:#3b2a00}
.gn.done{background:#fde68a;border-color:#f5b301}
.big{color:#fde68a}#doneScreen .card{border-top:6px solid #f5b301}#doneScreen .big{color:#0b2a5b;font-size:38px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
<div class="wm"></div>
  <div class="card">
    <div class="hero"><img src="logo.png" alt="" onerror="this.style.display='none'">
      <h1 class="school" id="schoolName">SMP NEGERI 44 BANDAR LAMPUNG</h1>
      <p class="tag">UJIAN ONLINE · VERSI PERCOBAAN</p></div>
    <div class="fbody">
    <label for="inTingkat">Tingkat</label>
    <select id="inTingkat"><option value="">Memuat...</option></select>
    <label for="inKelas">Kelas</label>
    <select id="inKelas"><option value="">-- pilih kelas --</option></select>
    <label for="inNama">Nama</label>
    <select id="inNama"><option value="">-- pilih nama --</option></select>
    <label for="inUjian">Mata pelajaran</label>
    <select id="inUjian"><option value="">Memuat daftar ujian...</option></select>
    <div class="sub" id="exInfo" style="margin:6px 0 0"></div>
    <label for="inToken" id="lblTok">Token ujian</label>
    <input id="inToken" autocomplete="off" autocapitalize="characters" placeholder="Token dari pengawas">
    <div id="modeBox" class="hidden"><label for="inJenis">Jenis ujian</label>
      <select id="inJenis"><option value="NORMAL">Normal</option><option value="SUSULAN">Susulan</option><option value="REMEDIAL">Remedial</option></select></div>
    <div id="loginErr" class="err hidden"></div>
    <button id="btnResume" class="btn gold hidden" style="margin-bottom:10px"></button>
    <button id="btnStart" class="btn">Mulai Ujian</button>
    <p class="sub" style="text-align:center;margin:14px 0 0;font-size:13px"><a href="#" id="lnkMode">Susulan / remedial</a></p>
    <a class="btn gold" href="nilai.html">🛡 Menu Pengawas</a>
    </div>
  </div>
</div>

<!-- UJIAN -->
<div id="examScreen" class="hidden">
  <div class="xbar">
    <div class="xname" id="xName"></div>
    <div class="xtimer" id="xTimer">--:--</div>
    <div class="xviol" id="xViol">⚠ 0</div>
    <button class="xnav" id="btnFont" title="Perbesar huruf">A+</button>
    <button class="xnav" id="btnRefresh" title="Muat ulang">⟳</button>
    <button class="xnav" id="btnGrid">Daftar</button>
  </div>
  <div class="stage lock" id="stage">
    <div class="qbox">
      <div class="wacana hidden" id="qWac"></div>
      <div class="qno" id="qNo"></div>
      <div class="qtext" id="qText"></div>
      <img class="qimg hidden" id="qImg" alt="">
      <div class="opts" id="qOpts"></div>
    </div>
  </div>
  <div class="bottom">
    <button class="btn sec" id="btnPrev">‹ Sebelumnya</button>
    <button class="btn" id="btnNext">Berikutnya ›</button>
  </div>
</div>

<!-- DAFTAR SOAL -->
<div id="gridBox" class="overlay hidden">
  <div class="mcard">
    <h2>Daftar Soal</h2>
    <div class="grid" id="gridNums"></div>
    <p id="gridInfo"></p>
    <button class="btn sec" id="gridClose">Kembali ke soal</button>
    <button class="btn green" id="gridFinish">Selesai &amp; Kirim</button>
  </div>
</div>

<!-- KONFIRMASI KIRIM -->
<div id="confirmBox" class="overlay hidden">
  <div class="mcard">
    <h2>Kirim jawaban?</h2>
    <p id="confirmText"></p>
    <div id="confirmErr" class="err hidden"></div>
    <button class="btn sec" id="confirmNo">Kembali ke soal</button>
    <button class="btn green" id="confirmYes">Ya, Kirim Sekarang</button>
  </div>
</div>

<!-- PENALTI -->
<div id="penalty" class="overlay hidden">
  <div class="mcard">
    <h2 id="penTitle">PELANGGARAN TERDETEKSI</h2>
    <p id="penText"></p>
    <div class="big" id="penCount">0</div>
    <p>Waktu ujian tetap berjalan.</p>
    <button class="btn" id="penBtn" disabled>Mohon tunggu...</button>
    <div class="note" id="fsNote"></div>
  </div>
</div>

<!-- SELESAI -->
<div id="doneScreen" class="hidden">
  <div class="card" style="text-align:center">
    <h1>Jawaban terkirim ✔</h1>
    <p class="sub" id="doneText"></p>
    <div class="big" id="doneScore"></div>
    <p class="sub">Silakan tutup halaman ini.</p>
  </div>
</div>

<script src="config.js"></script>
<div id="zoomBox" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:rgba(0,0,0,.93)">
  <div style="position:absolute;top:0;left:0;right:0;z-index:2;display:flex;gap:8px;justify-content:center;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px"><button class="xnav" id="zOut">−</button><button class="xnav" id="zIn">+</button><button class="xnav" id="zClose">Tutup ✕</button></div>
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-top:64px;touch-action:pan-x pan-y pinch-zoom"><img id="zImg" alt="" style="display:block;width:100%;max-width:none"></div>
</div>
<script>
(function () {
  'use strict';
  var C = window.U2 || {};
  function $(id) { return document.getElementById(id); }
  function show(id) { $(id).classList.remove('hidden'); }
  function hide(id) { $(id).classList.add('hidden'); }

  var S = null;            // state sesi
  var armed = false, paused = false, fsConfirmed = false;
  var deadline = 0, timerH = null, saveH = null, dirty = false, saveTimer = null;
  var focusTicks = 0, fsTimer = null;

  $('schoolName').textContent = C.sekolah || 'Ujian Online';

  /* ---------- API ---------- */
  function api(body, ms) {
    var ctl = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('Koneksi lambat / terputus')); }, ms || 25000); });
    var req = fetch(C.scriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), cache: 'no-store' })
      .then(function (r) { return r.json(); });
    return Promise.race([req, ctl]);
  }

  /* ---------- Login ---------- */
  try {
    var saved = JSON.parse(localStorage.getItem('u2_ident') || '{}');
    
    
  } catch (e) {}

  var ROS = {}, EXS = {};
  function opt(id, arr, ph) {
    var el = $(id); el.innerHTML = ''; var o = document.createElement('option'); o.value = ''; o.textContent = ph; el.appendChild(o);
    arr.forEach(function (x) { var p = document.createElement('option'); p.value = x[0]; p.textContent = x[1]; el.appendChild(p); });
  }
  function getJ(q) { return fetch(C.scriptUrl + '?action=' + q + '&_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }); }
  function loadRoster(pre) {
    if (pre && $('inTingkat').value) return;
    (pre ? Promise.resolve(pre) : getJ('roster')).then(function (d) {
      ROS = d.kelas || {}; var t = {};
      Object.keys(ROS).forEach(function (k) { t[k.charAt(0)] = 1; });
      opt('inTingkat', Object.keys(t).sort().map(function (x) { return [x, 'Kelas ' + x]; }), '-- pilih tingkat --');
    }).catch(function () { $('inTingkat').innerHTML = '<option value="">Gagal memuat. Muat ulang halaman.</option>'; });
  }
  $('inTingkat').addEventListener('change', function () {
    var t = this.value; opt('inKelas', Object.keys(ROS).filter(function (k) { return k.charAt(0) === t; }).sort().map(function (k) { return [k, k]; }), '-- pilih kelas --'); opt('inNama', [], '-- pilih nama --');
  });
  $('inKelas').addEventListener('change', function () {
    opt('inNama', (ROS[this.value] || []).slice().sort().map(function (n) { return [n, n]; }), '-- pilih nama --');
  });
  function showInfo() {
    var u = EXS[$('inUjian').value], i = $('exInfo'); if (!u) { i.textContent = ''; return; }
    i.textContent = u.durasi + ' menit' + (u.jam ? ' · Jam ' + u.jam : '') + (u.terbuka ? '' : ' · TOKEN BELUM DIBUKA / SUDAH DITUTUP');
    $('lblTok').textContent = $('inJenis').value === 'NORMAL' ? 'Token ujian' : 'Kode pengawas';
    $('inToken').parentNode.classList.toggle('hidden', false);
  }
  $('inUjian').addEventListener('change', showInfo); $('inJenis').addEventListener('change', showInfo);
  $('lnkMode').addEventListener('click', function (e) { e.preventDefault(); $('modeBox').classList.toggle('hidden'); if ($('modeBox').classList.contains('hidden')) $('inJenis').value = 'NORMAL'; showInfo(); });
  function loadExams(pre) {
    if (!C.scriptUrl || C.scriptUrl.indexOf('GANTI') === 0) { $('inUjian').innerHTML = '<option value="">scriptUrl belum diisi di config.js</option>'; return; }
    (pre ? Promise.resolve(pre) : getJ('list')).then(function (d) {
      var cur = $('inUjian').value; EXS = {};
      if (!d.ujian || !d.ujian.length) { opt('inUjian', [], 'Belum ada ujian aktif'); return; }
      d.ujian.forEach(function (u) { EXS[u.kode] = u; });
      opt('inUjian', d.ujian.map(function (u) { return [u.kode, u.nama + (u.terbuka ? '' : ' (tutup)')]; }), '-- pilih mapel --');
      if (cur) $('inUjian').value = cur; showInfo();
    }).catch(function () { if (!Object.keys(EXS).length) $('inUjian').innerHTML = '<option value="">Gagal memuat. Muat ulang halaman.</option>'; });
  }
  function boot() {
    try { var c = JSON.parse(localStorage.getItem('u2_boot') || 'null'); if (c && c.kelas) { loadRoster(c); loadExams(c); } } catch (e) {}
    getJ('boot').then(function (d) { loadRoster(d); loadExams(d); try { localStorage.setItem('u2_boot', JSON.stringify(d)); } catch (e) {} })
      .catch(function () { if (!Object.keys(ROS).length) { loadRoster(); loadExams(); } });
  }
  boot(); setInterval(function () { if (!S) loadExams(); }, 30000);

  function loginError(m) { var e = $('loginErr'); e.textContent = m; e.classList.remove('hidden'); }

  $('btnStart').addEventListener('click', function () { doStart({ nama: $('inNama').value.trim(), kelas: $('inKelas').value.trim(), kode: $('inUjian').value, token: $('inToken').value.trim(), jenis: $('inJenis').value }); });
  var RUN = null; try { RUN = JSON.parse(localStorage.getItem('u2_run') || 'null'); } catch (e) {}
  if (RUN && RUN.nama) { $('btnResume').textContent = '▶ Lanjutkan ujian: ' + RUN.nama; $('btnResume').classList.remove('hidden'); $('btnResume').addEventListener('click', function () { doStart(RUN); }); }
  function doStart(d) {
    var nama = d.nama, kelas = d.kelas, kode = d.kode, token = d.token, jenis = d.jenis;
    $('loginErr').classList.add('hidden');
    if (!nama || !kelas || !kode || !token) { loginError('Kelas, nama, mapel, dan token wajib diisi.'); return; }
    enterFullscreen(); // harus dipanggil langsung dari klik
    try { localStorage.setItem('u2_run', JSON.stringify(d)); } catch (e) {}
    var btn = $('btnStart'); btn.disabled = true; btn.textContent = 'Memuat soal...';
    api({ action: 'start', nama: nama, kelas: kelas, kode: kode, token: token, jenis: jenis }).then(function (r) {
      btn.disabled = false; btn.textContent = 'Mulai Ujian';
      if (!r.ok) { exitFullscreen(); if (r.selesai) { try { localStorage.removeItem('u2_run'); } catch (e) {} showDone(r.msg, ''); return; } loginError(r.msg || 'Gagal memulai'); return; }
      
      beginExam(r, nama, kelas, kode);
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = 'Mulai Ujian'; exitFullscreen();
      loginError((e && e.message) || 'Gagal terhubung');
    });
  }

  $('btnRefresh').addEventListener('click', function () { armed = false; location.reload(); });
  var FS = [16, 19, 22], fi = 0;
  $('btnFont').addEventListener('click', function () { fi = (fi + 1) % 3; document.documentElement.style.setProperty('--fs', FS[fi] + 'px'); });
  var zl = 1; function zset(v) { zl = Math.max(1, Math.min(4, v)); $('zImg').style.width = (zl * 100) + '%'; }
  $('qImg').addEventListener('click', function () { $('zImg').src = this.src; zset(1); $('zoomBox').classList.remove('hidden'); });
  $('zIn').addEventListener('click', function () { zset(zl + 0.5); }); $('zOut').addEventListener('click', function () { zset(zl - 0.5); });
  $('zClose').addEventListener('click', function () { $('zoomBox').classList.add('hidden'); });

  /* ---------- Acak (seed dari sessionId, stabil saat resume) ---------- */
  function seedFrom(str) { var h = 1779033703 ^ str.length; for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return h >>> 0; }
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(arr, rand) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function imgUrl(u) {
    if (!u) return '';
    var m = u.match(/drive\.google\.com\/file\/d\/([^\/?#]+)/) || u.match(/[?&]id=([^&]+)/);
    if (/drive\.google\.com/.test(u) && m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200';
    return /^https:\/\//.test(u) ? u : '';
  }

  /* ---------- Mulai ujian ---------- */
  function beginExam(r, nama, kelas, kode) {
    var rand = rng(seedFrom(r.sessionId));
    var qs = r.soal.map(function (q) {
      var letters = Object.keys(q.opsi);
      if (r.acak) letters = shuffle(letters, rand);
      return { no: q.no, soal: q.soal, wacana: q.wacana || '', gambar: q.gambar, opts: letters.map(function (L) { return [L, q.opsi[L]]; }) };
    });
    if (r.acak && !qs.some(function (x) { return x.wacana; })) qs = shuffle(qs, rand);
    var ans = r.jawaban || {};
    try { var loc = JSON.parse(localStorage.getItem('u2_ans_' + r.sessionId) || '{}'); for (var k in loc) if (!ans[k]) ans[k] = loc[k]; } catch (e) {}
    S = { id: r.sessionId, nama: nama, kelas: kelas, kode: kode, qs: qs, ans: ans, i: 0, viol: r.pelanggaran || 0 };
    deadline = Date.now() + r.sisaDetik * 1000;
    $('xName').textContent = nama + ' · ' + kelas;
    updViol();
    hide('loginScreen'); show('examScreen');
    render();
    timerH = setInterval(tick, 1000); tick();
    saveH = setInterval(function () { if (dirty) saveNow(); }, 60000);
    watchSecurity();
    armed = true;
    var penUntil = Number(localStorage.getItem('u2_pen_' + S.id) || 0);
    if (penUntil > Date.now()) { paused = true; showPenalty('Anda me-refresh halaman saat penalti berjalan.', Math.ceil((penUntil - Date.now()) / 1000), true); }
  }

  /* ---------- Tampilan soal ---------- */
  function render() {
    var q = S.qs[S.i];
    $('qNo').textContent = 'Soal ' + (S.i + 1) + ' dari ' + S.qs.length;
    $('qText').textContent = q.soal;
    var wc = $('qWac'); if (q.wacana) { wc.textContent = q.wacana; wc.classList.remove('hidden'); wc.scrollTop = 0; } else { wc.classList.add('hidden'); }
    var img = $('qImg'), u = imgUrl(q.gambar);
    if (u) { img.src = u; img.classList.remove('hidden'); } else { img.removeAttribute('src'); img.classList.add('hidden'); }
    var box = $('qOpts'); box.innerHTML = '';
    q.opts.forEach(function (o, idx) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'opt' + (S.ans[q.no] === o[0] ? ' sel' : '');
      var L = document.createElement('span'); L.className = 'L'; L.textContent = String.fromCharCode(65 + idx);
      var T = document.createElement('span'); T.className = 'T'; T.textContent = o[1];
      b.appendChild(L); b.appendChild(T);
      b.addEventListener('click', function () { if (paused) return; S.ans[q.no] = o[0]; persist(); render(); });
      box.appendChild(b);
    });
    $('btnPrev').disabled = S.i === 0;
    $('btnNext').textContent = S.i === S.qs.length - 1 ? 'Selesai ✔' : 'Berikutnya ›';
    window.scrollTo(0, 0);
  }
  $('btnPrev').addEventListener('click', function () { if (S.i > 0) { S.i--; render(); } });
  $('btnNext').addEventListener('click', function () { if (S.i < S.qs.length - 1) { S.i++; render(); } else openConfirm(); });

  function answeredCount() { var n = 0; S.qs.forEach(function (q) { if (S.ans[q.no]) n++; }); return n; }
  function openGrid() {
    var g = $('gridNums'); g.innerHTML = '';
    S.qs.forEach(function (q, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = i + 1;
      b.className = 'gn' + (S.ans[q.no] ? ' done' : '') + (i === S.i ? ' cur' : '');
      b.addEventListener('click', function () { S.i = i; hide('gridBox'); render(); });
      g.appendChild(b);
    });
    $('gridInfo').textContent = 'Terjawab ' + answeredCount() + ' dari ' + S.qs.length + ' soal.';
    show('gridBox');
  }
  $('btnGrid').addEventListener('click', openGrid);
  $('gridClose').addEventListener('click', function () { hide('gridBox'); });
  $('gridFinish').addEventListener('click', function () { hide('gridBox'); openConfirm(); });

  /* ---------- Simpan ---------- */
  function persist() {
    dirty = true;
    try { localStorage.setItem('u2_ans_' + S.id, JSON.stringify(S.ans)); } catch (e) {}
    clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 8000);
  }
  function saveNow() {
    if (!S) return;
    api({ action: 'save', sessionId: S.id, answers: S.ans, pelanggaran: S.viol }, 15000).then(function (r) { if (r && r.ok) dirty = false; }).catch(function () {});
  }

  /* ---------- Timer ---------- */
  function tick() {
    var left = Math.round((deadline - Date.now()) / 1000);
    if (left < 0) left = 0;
    var m = Math.floor(left / 60), s = left % 60;
    var t = $('xTimer'); t.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    t.className = 'xtimer' + (left <= 60 ? ' danger' : left <= 300 ? ' warn' : '');
    if (left <= 0) { clearInterval(timerH); doSubmit(true); }
  }

  /* ---------- Kirim ---------- */
  function firstEmpty() { for (var i = 0; i < S.qs.length; i++) if (!S.ans[S.qs[i].no]) return i; return -1; }
  function openConfirm() {
    var tot = S.qs.length, ans = answeredCount(), un = tot - ans, empty = [];
    S.qs.forEach(function (q, i) { if (!S.ans[q.no]) empty.push(i + 1); });
    $('confirmText').textContent = 'Jumlah soal: ' + tot + '. Terjawab: ' + ans + '. Belum dijawab: ' + un + '.' + (un > 0 ? ' Semua soal wajib dijawab. Soal kosong: ' + empty.join(', ') + '.' : ' Setelah dikirim, jawaban tidak bisa diubah.');
    $('confirmYes').classList.toggle('hidden', un > 0);
    $('confirmNo').classList.remove('hidden');
    $('confirmNo').textContent = un > 0 ? 'Ke soal yang kosong' : 'Kembali ke soal';
    $('confirmErr').classList.add('hidden');
    show('confirmBox');
  }
  $('confirmNo').addEventListener('click', function () { hide('confirmBox'); var f = firstEmpty(); if (f > -1) { S.i = f; render(); } });
  $('confirmYes').addEventListener('click', function () { doSubmit(false); });

  var submitting = false;
  function doSubmit(auto) {
    if (submitting) return; submitting = true;
    var btn = $('confirmYes'); btn.disabled = true; btn.textContent = 'Mengirim...';
    if (auto) { hide('gridBox'); hide('penalty'); $('confirmNo').classList.add('hidden'); $('confirmYes').classList.remove('hidden'); show('confirmBox'); $('confirmText').textContent = 'Waktu habis. Mengirim jawaban Anda...'; }
    api({ action: 'submit', sessionId: S.id, answers: S.ans, pelanggaran: S.viol }, 30000).then(function (r) {
      submitting = false; btn.disabled = false; btn.textContent = 'Ya, Kirim Sekarang';
      if (!r.ok) throw new Error(r.msg || 'Gagal mengirim');
      armed = false; clearInterval(timerH); clearInterval(saveH);
      try { localStorage.removeItem('u2_ans_' + S.id); localStorage.removeItem('u2_run'); localStorage.removeItem('u2_pen_' + S.id); } catch (e) {}
      exitFullscreen();
      var bd = (r.tampilNilai && r.nilai !== null) ? band(r.nilai, r.maks) : null;
      showDone(bd ? bd.msg : 'Jawaban Anda sudah diterima.', bd ? bd.rng : '');
    }).catch(function (e) {
      submitting = false; btn.disabled = false; btn.textContent = 'Coba Kirim Lagi';
      var er = $('confirmErr'); er.textContent = (e && e.message ? e.message : 'Gagal mengirim') + '. Periksa sinyal lalu tekan Coba Kirim Lagi. Jawaban Anda aman di perangkat ini.'; er.classList.remove('hidden');
      show('confirmBox');
      if (auto) { setTimeout(function () { if (!submitting) doSubmit(true); }, 5000); }
    });
  }
  function band(n, mx) {
    n = Number(n) || 0; mx = Number(mx) || 100; var c = Math.round(n / 10) * 10, lo = Math.max(0, Math.min(c - 10, Math.max(0, mx - 20))), hi = Math.min(lo + 20, mx), m;
    if (hi / mx <= 0.6) m = 'Tingkatkan niat belajarmu, kamu berhasil mendapat nilai di antara ' + lo + ' dan ' + hi + '. Tetap semangat, kamu pasti bisa lebih baik!';
    else if (hi / mx <= 0.8) m = 'Bagus! Nilaimu berada di antara ' + lo + ' dan ' + hi + '. Terus belajar agar hasilmu makin baik.';
    else m = 'Luar biasa! Nilaimu berada di antara ' + lo + ' dan ' + hi + '. Pertahankan semangat belajarmu!';
    return { rng: lo + ' – ' + hi, msg: 'Jawaban terkirim. ' + m };
  }
  function showDone(msg, score) {
    hide('loginScreen'); hide('examScreen'); hide('gridBox'); hide('confirmBox'); hide('penalty');
    $('doneText').textContent = msg; $('doneScore').textContent = score; show('doneScreen');
  }

  /* ---------- Fullscreen ---------- */
  function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function enterFullscreen() {
    var d = document.documentElement;
    try {
      var p = d.requestFullscreen ? d.requestFullscreen() : (d.webkitRequestFullscreen ? d.webkitRequestFullscreen() : null);
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
    var tries = 0; (function chk() { setTimeout(function () { if (isFS()) { fsConfirmed = true; return; } if (++tries < 6) chk(); else if (!fsConfirmed) $('fsNote').textContent = 'Perangkat ini tidak mendukung layar penuh. Gunakan Chrome (Android) atau Safari (iPhone).'; }, 350); })();
  }
  function exitFullscreen() { try { if (isFS()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } } catch (e) {} }

  /* ---------- Pelanggaran ---------- */
  function updViol() { $('xViol').textContent = '⚠ ' + S.viol; }
  function logSrv(tipe, detail) { api({ action: 'log', sessionId: S.id, nama: S.nama, kelas: S.kelas, tipe: tipe, detail: detail }, 15000).catch(function () {}); }
  function beep() { try { var A = window.AudioContext || window.webkitAudioContext; if (!A) return; var c = new A(), o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.value = 660; g.gain.value = .25; o.connect(g); g.connect(c.destination); o.start(); setTimeout(function () { try { o.stop(); c.close(); } catch (e) {} }, 1500); } catch (e) {} }

  function violation(type, detail) {
    if (!armed || paused) return;
    paused = true; S.viol++; updViol(); beep(); logSrv(type, detail);
    api({ action: 'save', sessionId: S.id, answers: S.ans, pelanggaran: S.viol }, 15000).catch(function () {});
    if (C.autoSubmitPelanggaran > 0 && S.viol >= C.autoSubmitPelanggaran) { doSubmit(true); return; }
    var arr = C.penaltiDetik || [30, 60, 120];
    var secs = arr[Math.min(S.viol - 1, arr.length - 1)];
    try { localStorage.setItem('u2_pen_' + S.id, String(Date.now() + secs * 1000)); } catch (e) {}
    showPenalty(detail, secs, false);
  }
  var penH = null;
  function showPenalty(detail, secs, isRefresh) {
    hide('gridBox'); hide('confirmBox');
    $('penTitle').textContent = 'PELANGGARAN TERDETEKSI (' + S.viol + ')';
    $('penText').textContent = detail;
    var btn = $('penBtn'); btn.disabled = true; btn.textContent = 'Mohon tunggu...';
    show('penalty');
    var until = Date.now() + secs * 1000;
    clearInterval(penH);
    function t() {
      var left = Math.ceil((until - Date.now()) / 1000);
      if (left > 0) { $('penCount').textContent = left; return; }
      clearInterval(penH); $('penCount').textContent = '0'; btn.disabled = false; btn.textContent = 'Saya Mengerti, Lanjutkan Ujian';
    }
    penH = setInterval(t, 500); t();
  }
  $('penBtn').addEventListener('click', function () {
    hide('penalty'); try { localStorage.removeItem('u2_pen_' + S.id); } catch (e) {}
    focusTicks = 0; paused = false; enterFullscreen();
  });

  /* ---------- Deteksi ---------- */
  function watchSecurity() {
    // Pindah tab / minimize / layar mati
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) violation('VISIBILITY_HIDDEN', 'Anda berpindah tab/aplikasi atau meminimalkan browser.');
      else checkFS();
    });
    // Halaman kehilangan fokus (panel pencarian Google, Circle to Search, aplikasi lain di atas layar)
    window.addEventListener('blur', function () {
      if (!armed || paused) return;
      setTimeout(function () { if (!document.hidden && !document.hasFocus()) violation('WINDOW_BLUR', 'Halaman ujian kehilangan fokus (aplikasi/panel lain muncul).'); }, 700);
    });
    setInterval(function () {
      if (!armed || paused || document.hidden) { focusTicks = 0; return; }
      if (document.hasFocus()) { focusTicks = 0; return; }
      if (++focusTicks >= 2) { focusTicks = 0; violation('FOCUS_LOST', 'Halaman ujian kehilangan fokus (kemungkinan panel pencarian/overlay muncul).'); }
    }, 1000);
    // Keluar layar penuh (hanya jika perangkat terbukti pernah masuk layar penuh)
    function onFS() { if (isFS()) { fsConfirmed = true; if (fsTimer) { clearTimeout(fsTimer); fsTimer = null; } } else checkFS(); }
    document.addEventListener('fullscreenchange', onFS); document.addEventListener('webkitfullscreenchange', onFS);
    setInterval(function () { if (armed && !paused) checkFS(); }, 2000);
    // Salin / menu / sorot teks / pintasan
    ['contextmenu', 'copy', 'cut', 'paste', 'selectstart', 'dragstart'].forEach(function (ev) {
      document.addEventListener(ev, function (e) { if (S) e.preventDefault(); }, true);
    });
    document.addEventListener('selectionchange', function () { if (S && armed) { var s = window.getSelection && window.getSelection(); if (s && s.rangeCount && String(s) !== '') s.removeAllRanges(); } });
    window.addEventListener('keydown', function (e) {
      if (!armed) return;
      var k = (e.key || '').toLowerCase();
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && 'ijc'.indexOf(k) > -1)) { e.preventDefault(); violation('DEVTOOLS', 'Mencoba membuka DevTools.'); }
      else if (e.ctrlKey && 'usp'.indexOf(k) > -1) { e.preventDefault(); violation('SHORTCUT', 'Mencoba memakai pintasan terlarang (Ctrl+' + k.toUpperCase() + ').'); }
    });
    // Cegah refresh tak sengaja
    window.addEventListener('beforeunload', function (e) { if (armed && !submitting) { e.preventDefault(); e.returnValue = ''; } });
  }
  function checkFS() {
    if (!armed || paused || !fsConfirmed || isFS() || fsTimer) return;
    fsTimer = setTimeout(function () { fsTimer = null; if (!isFS()) violation('FULLSCREEN_EXIT', 'Anda keluar dari mode layar penuh.'); }, 600);
  }
})();
</script>
</body>
</html>
